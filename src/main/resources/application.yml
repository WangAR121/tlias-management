spring:
  application:
    name: tlias-web-management
  datasource:
    # 数据库连接：默认连本机 3306 的 tlias 库；账号密码从环境变量读取，仓库里不留明文
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tlias}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
mybatis:
  mapper-locations: classpath*:heima/item/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    驼峰命名映射开关
    map-underscore-to-camel-case: true
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
aliyun:
  oss:
    # 阿里云 OSS：endpoint/region 有默认值，bucket 和 AccessKey 必须自己用环境变量提供
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    region: ${OSS_REGION:cn-beijing}
    bucketName: ${OSS_BUCKET_NAME}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}